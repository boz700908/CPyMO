name: Package All Platforms

# 把某一次 ci.yml 的 run 的全部平台产物，按「普通版 / 无障碍版」各打一个总包。
# 总包内每个平台仍是一个独立压缩包，与原 artifact 内容一致。
#
# 之所以在 CI 里做而不是本机：从国内服务器直连 artifact 存储只有 ~40 KB/s，
# 全部产物 385 MB 要一个多小时；CI 拉取同一仓库的 artifact 是内网速度。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '要打包的 ci.yml run id'
        required: true
        default: '44051537443'
      release_tag:
        description: '发布 tag；留空则只打包不发布'
        required: false
        default: 'v1.2.0'
      release_notes:
        description: '发布说明文件（仓库内相对路径）'
        required: false
        default: '.github/release-notes/v1.2.0.md'

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: '打包：普通版 / 无障碍版'
    runs-on: ubuntu-latest
    steps:
      - name: Download every artifact of the source run
        uses: actions/download-artifact@v6.0.0
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: all

      - name: Group into two bundles
        run: |
          set -euo pipefail
          mkdir -p bundles
          shopt -s nullglob
          n=0
          for d in all/*/; do
            name=$(basename "$d")
            case "$name" in
              *"(Accessibility)")
                out="bundles/CPyMO-accessibility-all-platforms.zip" ;;
              *)
                out="bundles/CPyMO-plain-all-platforms.zip" ;;
            esac
            # 追加进同一个总包；cd 到 all 里打，包内路径就是平台目录名。
            ( cd all && zip -qr "../$out" "$name" )
            n=$((n+1))
          done
          echo "platforms packaged: $n"
          ls -l bundles

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          for f in bundles/*.zip; do
            echo "=== $f"
            unzip -l "$f" | tail -n 3
            echo "--- platforms:"
            unzip -Z1 "$f" | cut -d/ -f1 | sort -u
          done

      - name: Upload bundles
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO all platforms (bundles)
          path: bundles/*.zip
          # 里面已经是压缩包，不必再压一遍。
          compression-level: 0
          if-no-files-found: error

  release:
    name: '发布：创建 Release 并上传总包'
    needs: package
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Download the bundles just built
        uses: actions/download-artifact@v6.0.0
        with:
          name: CPyMO all platforms (bundles)
          path: bundles

      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          ls -l bundles
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为覆盖资产"
            gh release upload "$TAG" bundles/*.zip --clobber
          else
            gh release create "$TAG" bundles/*.zip \
              --title "CPyMO Aria $TAG" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json tagName,name,assets
