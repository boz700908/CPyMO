name: Switch debug

# 临时调试流水线：只编 Switch 无障碍版 nro，用于定位 Eden 上无声的问题。
# 手动触发，不参与全量 CI；问题定位后可删除。

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-switch-accessibility:
    name: 'Switch (Accessibility) 调试包'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20230507

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Stage TTS assets into romfs
      shell: bash
      run: |
        set -e
        test -d tts-assets || { echo "缺少 tts-assets（语音资源必须随包发布）"; exit 1; }
        for name in rtld main sdk; do
          test "$(head -c 4 "tts-assets/$name.bin")" = NSO0 || { echo "$name.bin 不是 NSO0"; exit 1; }
        done
        test -s tts-assets/D32-YAFANG.vtdb2 || { echo "缺少音库"; exit 1; }
        mkdir -p cpymo-backends/sdl2/romfs/tts
        cp tts-assets/*.bin tts-assets/*.vtdb2 cpymo-backends/sdl2/romfs/tts/
        cp cpymo-backends/sdl2/*.wav cpymo-backends/sdl2/romfs/
        ls -l cpymo-backends/sdl2/romfs/tts

    - name: Build
      shell: bash
      run: |
        set -o pipefail
        cd ./cpymo-backends/sdl2
        make -j -f Makefile.Switch ENABLE_TEXT_EXTRACT=1 2>&1 | tail -200

    - name: Check nro
      shell: bash
      run: |
        cd ./cpymo-backends/sdl2
        test -f build.Switch/cpymo.nro || { echo "没有生成 cpymo.nro"; exit 1; }
        ls -l build.Switch/cpymo.nro

    - name: Upload nro
      uses: actions/upload-artifact@v6.0.0
      with:
        name: cpymo-switch-debug
        path: ./cpymo-backends/sdl2/build.Switch/cpymo.nro
        if-no-files-found: error
