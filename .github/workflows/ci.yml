  build-macos:
    name: 'macOS'
    # macOS 托管 runner 供不应求：实测连续几轮，一个 run 里能分到的 mac runner 只有
    # 一两个，其余 mac job 排到 20 分钟上限就被 cancelled（runner_name 空、无任何
    # step，不是编译失败）。全部 mac 产物因此收进这一个 job：只排一次队，分到 runner
    # 之后队列再挤也不影响已经开始的构建。顺序上先出快的（命令行版、iOS），再出桌面四版。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          submodules: 'recursive'

      - name: Setup Dependents for MacOS
        run: brew install pkg-config autoconf autoconf-archive automake libtool

      # ---- 命令行版（不依赖 vcpkg，先出产物） ----
      - name: Build CPyMO Text
        run: |
          make -C cpymo-backends/text -j
          strip cpymo-backends/text/cpymo-text

      - name: Upload CPyMO Text
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO Text for macOS
          path: ./cpymo-backends/text/cpymo-text

      - name: Build CPyMO ASCII Art
        run: |
          make -C cpymo-backends/ascii-art -j
          strip cpymo-backends/ascii-art/cpymo-ascii-art

      - name: Upload CPyMO ASCII Art
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO ASCII Art for macOS
          path: ./cpymo-backends/ascii-art/cpymo-ascii-art

      # ---- iOS 两版 ----
      - name: Restore FFmpeg cache (iOS)
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: cpymo-backends/ios/FFmpeg-iOS-build-script/thin/arm64
          key: ffmpeg-ios-arm64-${{ hashFiles('cpymo-backends/ios/FFmpeg-iOS-build-script/build-ffmpeg.sh') }}
          restore-keys: |
            ffmpeg-ios-arm64-

      - name: Build FFmpeg (iOS)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ./cpymo-backends/ios/FFmpeg-iOS-build-script
        run: |
          chmod +x ./build-ffmpeg.sh
          sed -i '' 's/CFLAGS="-arch $ARCH"/CFLAGS="-arch $ARCH -Wno-error=unguarded-availability -Wno-error=unguarded-availability-new"/g' ./build-ffmpeg.sh
          sed -i '' 's/--enable-pic"/--enable-pic --disable-securetransport"/g' ./build-ffmpeg.sh
          for attempt in 1 2 3; do
            rm -rf ffmpeg-4.3.1 thin
            if ./build-ffmpeg.sh arm64; then exit 0; fi
            echo "iOS FFmpeg build failed on attempt $attempt"
            sleep 10
          done
          exit 1

      - name: Build IPA
        shell: bash
        working-directory: ./cpymo-backends/ios
        run: |
          rm -rf build
          cmake -S. -Bbuild -DCMAKE_TOOLCHAIN_FILE=./ios-cmake/ios.toolchain.cmake -DENABLE_BITCODE=0 -DPLATFORM=OS64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_FLAGS="-Wno-error=unguarded-availability-new" -DCMAKE_OBJC_FLAGS="-Wno-error=unguarded-availability-new"
          cmake --build build -j $(sysctl -n hw.physicalcpu) --config Release
          cd ./build
          mkdir Payload
          mv cpymo.app Payload/
          zip -r cpymo.ipa Payload
          mv ./cpymo.ipa ../../../cpymo.ipa

      - name: Upload iOS
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO for iOS
          path: ./cpymo.ipa

      - name: Build IPA (Accessibility)
        shell: bash
        working-directory: ./cpymo-backends/ios
        run: |
          rm -rf build
          cmake -S. -Bbuild -DCMAKE_TOOLCHAIN_FILE=./ios-cmake/ios.toolchain.cmake -DENABLE_BITCODE=0 -DPLATFORM=OS64 -DENABLE_ACCESSIBILITY=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_FLAGS="-Wno-error=unguarded-availability-new" -DCMAKE_OBJC_FLAGS="-Wno-error=unguarded-availability-new"
          cmake --build build -j $(sysctl -n hw.physicalcpu) --config Release
          cd ./build
          mkdir Payload
          mv cpymo.app Payload/
          zip -r cpymo.ipa Payload
          mv ./cpymo.ipa ../../../cpymo.ipa

      - name: Upload iOS (Accessibility)
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO for iOS (Accessibility)
          path: ./cpymo.ipa

      # ---- 桌面四版（普通 / 无障碍 × x64 / Apple Silicon） ----
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-bin-macOS-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-macOS-

      - name: Download vcpkg
        run: git clone --depth 1 --branch 2026.10.16 -- https://github.com/microsoft/vcpkg

      - name: Bootstrap vcpkg
        run: |
          mkdir -p ~/.vcpkg
          touch ~/.vcpkg/vcpkg.path.txt
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg integrate install

      - name: Install SDL2 and FFmpeg
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
        run: |
          ./vcpkg/vcpkg install sdl2:x64-osx sdl2:arm64-osx
          ./vcpkg/vcpkg install ffmpeg:x64-osx ffmpeg:arm64-osx

      - name: Build macOS x64
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-osx -B build-mac-x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build-mac-x64 --config ${{env.BUILD_TYPE}}
          strip ./build-mac-x64/build/cpymo
          strip ./build-mac-x64/build/cpymo-tool
          ./scripts/package-macos.sh ./build-mac-x64/build/cpymo ./dist-mac-x64 "macOS x64"

      - name: Upload macOS x64
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO for macOS x64
          path: ./dist-mac-x64/*

      - name: Build macOS Apple Silicon
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx -B build-mac-arm64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-mac-arm64 --config ${{env.BUILD_TYPE}}
          strip ./build-mac-arm64/build/cpymo
          strip ./build-mac-arm64/build/cpymo-tool
          ./scripts/package-macos.sh ./build-mac-arm64/build/cpymo ./dist-mac-arm64 "macOS Apple Silicon"

      - name: Upload macOS Apple Silicon
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO for macOS Apple Silicon
          path: ./dist-mac-arm64/*

      - name: Build macOS x64 (Accessibility)
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-osx -B build-mac-x64-a11y -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_OSX_ARCHITECTURES=x86_64 -DENABLE_ACCESSIBILITY=ON
          cmake --build build-mac-x64-a11y --config ${{env.BUILD_TYPE}}
          strip ./build-mac-x64-a11y/build/cpymo
          strip ./build-mac-x64-a11y/build/cpymo-tool
          ./scripts/package-macos.sh ./build-mac-x64-a11y/build/cpymo ./dist-mac-x64-a11y "macOS x64 (Accessibility)"

      - name: Upload macOS x64 (Accessibility)
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO for macOS x64 (Accessibility)
          path: ./dist-mac-x64-a11y/*

      - name: Build macOS Apple Silicon (Accessibility)
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx -B build-mac-arm64-a11y -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_OSX_ARCHITECTURES=arm64 -DENABLE_ACCESSIBILITY=ON
          cmake --build build-mac-arm64-a11y --config ${{env.BUILD_TYPE}}
          strip ./build-mac-arm64-a11y/build/cpymo
          strip ./build-mac-arm64-a11y/build/cpymo-tool
          ./scripts/package-macos.sh ./build-mac-arm64-a11y/build/cpymo ./dist-mac-arm64-a11y "macOS Apple Silicon (Accessibility)"

      - name: Upload macOS Apple Silicon (Accessibility)
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO for macOS Apple Silicon (Accessibility)
          path: ./dist-mac-arm64-a11y/*

  build-ascii-art:
    name: 'CPyMO ASCII Art'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ 'windows-latest', 'ubuntu-latest' ]

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          submodules: 'recursive'

      - uses: msys2/setup-msys2@v2.33.0
        if: ${{ runner.os == 'Windows' }}
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-toolchain make

      - name: 'Build'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make -j
          strip ./cpymo-ascii-art

      - name: 'Build (Windows)'
        shell: msys2 {0}
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make -j
          strip ./cpymo-ascii-art.exe

      - name: 'Upload'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO ASCII Art for ${{ runner.os }}
          path: |
            ./cpymo-backends/ascii-art/cpymo-ascii-art
            ./cpymo-backends/ascii-art/cpymo-ascii-art.exe



  build-text:
    name: 'CPyMO Text'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ 'windows-latest', 'ubuntu-latest' ]

    steps:
      - uses: actions/checkout@v4.4.0
