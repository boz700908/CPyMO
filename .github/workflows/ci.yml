      - uses: msys2/setup-msys2@v2.33.0
        if: ${{ runner.os == 'Windows' }}
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-toolchain make


      - name: 'Build'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/text/
