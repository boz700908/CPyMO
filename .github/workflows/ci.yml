name: CI

on:
  workflow_dispatch:
    inputs:
      web_game_archive_url:
        description: 'Optional direct URL of a game ZIP archive to package for Web'
        required: false
        type: string
      web_build_type:
        description: 'Web output type when a game archive is supplied'
        required: false
        type: choice
        options:
          - js
          - wasm
  pull_request:
    branches: [ main, hd, dev ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
  # 安装包（NSP）的 title id：固定常量，不随机、不随构建变化。
  # 末尾 0594d4f = "PyMO" 的 ASCII（50 79 4d 4f），因此不会与别家 homebrew 撞车。
  CPYMO_TITLE_ID: '0100000050594d4f'

jobs:
  build-switch:
    name: 'Nintendo Switch'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20230507

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Build
      run: |
        cd ./cpymo-backends/sdl2
        make -j -f Makefile.Switch

    - name: Package
      shell: bash
      run: |
        cd ./cpymo-backends/sdl2
        mkdir -p dist
        test -f build.Switch/cpymo.nro || { echo "没有生成 cpymo.nro"; exit 1; }
        cp build.Switch/cpymo.nro dist/
        test -f startup.wav || { echo "缺少 startup.wav（启动音乐）"; exit 1; }
        cp startup.wav dist/
        ls -R dist

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Nintendo Switch
        path: ./cpymo-backends/sdl2/dist

  build-switch-accessibility:
    name: 'Nintendo Switch (Accessibility)'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20230507

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Stage TTS assets into romfs
      shell: bash
      run: |
        set -e
        test -d tts-assets || { echo "缺少 tts-assets（语音资源必须随包发布）"; exit 1; }
        for name in rtld main sdk; do
          test "$(head -c 4 "tts-assets/$name.bin")" = NSO0 || { echo "$name.bin 不是 NSO0"; exit 1; }
        done
        test -s tts-assets/D32-YAFANG.vtdb2 || { echo "缺少音库"; exit 1; }
        mkdir -p cpymo-backends/sdl2/romfs/tts
        cp tts-assets/*.bin tts-assets/*.vtdb2 cpymo-backends/sdl2/romfs/tts/
        cp cpymo-backends/sdl2/*.wav cpymo-backends/sdl2/romfs/
        ls -l cpymo-backends/sdl2/romfs/tts

    - name: Build
      shell: bash
      run: |
        set -o pipefail
        cd ./cpymo-backends/sdl2
        make -j -f Makefile.Switch ENABLE_TEXT_EXTRACT=1 2>&1 | tail -160

    - name: Package
      shell: bash
      run: |
        cd ./cpymo-backends/sdl2
        mkdir -p dist
        test -f build.Switch/cpymo.nro || { echo "没有生成 cpymo.nro"; exit 1; }
        cp build.Switch/cpymo.nro dist/
        cp enter.wav menu.wav select.wav dist/ 2>/dev/null || true
        test -f startup.wav || { echo "缺少 startup.wav（启动音乐）"; exit 1; }
        cp startup.wav dist/
        test -d ../../tts-assets || { echo "缺少 tts-assets（语音资源必须随包发布）"; exit 1; }
        mkdir -p dist/tts
        cp ../../tts-assets/*.bin dist/tts/ 2>/dev/null || true
        cp ../../tts-assets/*.vtdb2 dist/tts/ 2>/dev/null || true
        test -f dist/tts/rtld.bin && test -f dist/tts/main.bin && test -f dist/tts/sdk.bin \
          || { echo "tts 资源不完整（需要 rtld/main/sdk）"; exit 1; }
        ls -R dist

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Nintendo Switch (Accessibility)
        path: ./cpymo-backends/sdl2/dist

    - name: Make exefs, NPDM and control
      shell: bash
      run: |
        set -euxo pipefail
        test "$CPYMO_TITLE_ID" = "0100000050594d4f" || { echo "NSP 的 title id 必须固定为 0100000050594d4f，不允许随构建变化"; exit 1; }
        cd ./cpymo-backends/sdl2
        mkdir -p /tmp/pkg/exefs /tmp/pkg/control
        cp build.Switch/cpymo.elf /tmp/pkg/
        elf2nso /tmp/pkg/cpymo.elf /tmp/pkg/exefs/main
        # NPDM 字段取值依据：title id 范围收窄到本程序自身；权限位与内核能力取
        # devkitPro/libnx homebrew 的常规值；service_access 只列 CPyMO(SDL2) 实际会用到的
        # 服务名（均在 libnx 源码中出现，长度 1..8，符合 NPDM 的 SACP 编码限制）。
        cat > /tmp/pkg/npdm.json <<JSON
        {
          "name": "CPyMO",
          "title_id": "0x$CPYMO_TITLE_ID",
          "program_id": "0x$CPYMO_TITLE_ID",
          "title_id_range_min": "0x$CPYMO_TITLE_ID",
          "title_id_range_max": "0x$CPYMO_TITLE_ID",
          "program_id_range_min": "0x$CPYMO_TITLE_ID",
          "program_id_range_max": "0x$CPYMO_TITLE_ID",
          "version": "0x0",
          "system_resource_size": "0x0",
          "main_thread_stack_size": "0x00100000",
          "main_thread_priority": 44,
          "default_cpu_id": 0,
          "process_category": 0,
          "is_retail": true,
          "pool_partition": 0,
          "is_64_bit": true,
          "address_space_type": 3,
          "optimize_memory_allocation": false,
          "disable_device_address_space_merge": false,
          "signature_key_generation": 0,
          "filesystem_access": { "permissions": "0xFFFFFFFFFFFFFFFF" },
          "service_access": ["appletAE", "appletOE", "hid", "hid:sys", "audout:u", "audren:u",
                             "vi:m", "nvdrv", "nvdrv:a", "fsp-srv", "fsp-ldr", "ldr:ro",
                             "set", "set:sys", "time:u", "time:s", "apm", "psc:m",
                             "spsm", "pcv", "spl:", "acc:u0", "nifm:u"],
          "kernel_capabilities": [
            { "type": "kernel_flags", "value": { "highest_thread_priority": 63, "lowest_thread_priority": 24, "highest_cpu_id": 3, "lowest_cpu_id": 0 } }
          ]
        }
        JSON
        npdmtool /tmp/pkg/npdm.json /tmp/pkg/exefs/main.npdm
        nacptool --create "CPyMO" "boz700908" "1.0.0" /tmp/pkg/control/control.nacp --titleid=0x$CPYMO_TITLE_ID
        ls -l /tmp/pkg/exefs /tmp/pkg/control

    - name: Upload exefs
      uses: actions/upload-artifact@v6.0.0
      with:
        name: switch-exefs
        path: |
          /tmp/pkg/exefs
          /tmp/pkg/control
        if-no-files-found: error

  build-switch-nsp:
    name: 'Nintendo Switch (NSP)'
    needs: build-switch-accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4.4.0

    - name: Download exefs
      uses: actions/download-artifact@v6.0.0
      with:
        name: switch-exefs
        path: /tmp/pkg

    - name: Write keys
      env:
        SWITCH_PROD_KEYS: ${{ secrets.SWITCH_PROD_KEYS }}
      run: |
        set -euo pipefail
        printf '%s\n' "$SWITCH_PROD_KEYS" > /tmp/keys.raw
        if base64 -d /tmp/keys.raw > /tmp/keys.dec 2>/dev/null && grep -q header_key /tmp/keys.dec; then
          install -m 600 /tmp/keys.dec /tmp/prod.keys
        else
          install -m 600 /tmp/keys.raw /tmp/prod.keys
        fi
        # hacBrewPack 用前缀匹配 key 名，34 位的 master_kek_source_* 会被当成期望 32 位的 key
        awk -F'=' 'NF>=2 { v=$2; gsub(/[ \t\r]/,"",v); if (length(v)==34) next } { print }' /tmp/prod.keys > /tmp/prod.clean
        install -m 600 /tmp/prod.clean /tmp/prod.keys
        echo "keys 有效行数: $(grep -c . /tmp/prod.keys)"

    - name: Build hacBrewPack
      run: |
        set -euxo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential
        git clone --depth 1 https://github.com/rlaphoenix/hacBrewPack /tmp/hbp
        cd /tmp/hbp
        if [ -f config.mk.template ]; then cp config.mk.template config.mk; fi
        make -j"$(nproc)" 2>&1 | tail -25

    - name: Stage romfs
      run: |
        set -e
        test -d tts-assets || { echo "缺少 tts-assets（语音资源必须随包发布）"; exit 1; }
        for name in rtld main sdk; do
          test "$(head -c 4 "tts-assets/$name.bin")" = NSO0 || { echo "$name.bin 不是 NSO0"; exit 1; }
        done
        test -s tts-assets/D32-YAFANG.vtdb2 || { echo "缺少音库"; exit 1; }
        mkdir -p /tmp/pkg/romfs/tts
        cp tts-assets/*.bin tts-assets/*.vtdb2 /tmp/pkg/romfs/tts/
        cp cpymo-backends/sdl2/*.wav /tmp/pkg/romfs/
        du -sh /tmp/pkg/romfs

    - name: Pack NSP
      run: |
        set -euxo pipefail
        test "$CPYMO_TITLE_ID" = "0100000050594d4f" || { echo "NSP 的 title id 必须固定为 0100000050594d4f，不允许随构建变化"; exit 1; }
        cd /tmp/hbp
        if [ ! -x ./hacbrewpack ]; then echo "没找到 hacbrewpack"; ls -l; exit 1; fi
        # hacBrewPack 不生成 .tik/.cert：若 NCA 用 title key 加密，模拟器拿不到 title key
        # 会在 Core 初始化阶段崩掉。--plaintext 让 section 不加密，yuzu/Eden 按 homebrew 直接加载。
        ./hacbrewpack -k /tmp/prod.keys --nologo --plaintext --romfsdir /tmp/pkg/romfs \
          --exefsdir /tmp/pkg/exefs --controldir /tmp/pkg/control \
          --nspdir /tmp/pkg/nsp --ncadir /tmp/pkg/nca \
          --tempdir /tmp/pkg/temp --backupdir /tmp/pkg/backup \
          --keepncadir --titleid $CPYMO_TITLE_ID \
          --titlename CPyMO --titlepublisher boz700908 2>&1 | tail -60
        ls -l /tmp/pkg/nsp

    - name: Upload NSP
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Nintendo Switch (NSP)
        path: /tmp/pkg/nsp/*.nsp
        if-no-files-found: error

  build-3ds:
    name: 'Nintendo 3DS'
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Install Makerom
      run: |
        cd ./cpymo-backends/3ds
        wget https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip
        unzip makerom-v0.17-ubuntu_x86_64.zip -d .
        chmod +x makerom

    - name: Restore FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v4
      with:
        path: cpymo-backends/build.FFmpeg.3DS
        key: ffmpeg-3ds-${{ hashFiles('cpymo-backends/3ds/build-3ds-ffmpeg.sh') }}
        restore-keys: |
          ffmpeg-3ds-

    - name: Build FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: |
        cd ./cpymo-backends/3ds
        chmod +x ./build-3ds-ffmpeg.sh
        ./build-3ds-ffmpeg.sh

    - name: Build
      run: |
        cd ./cpymo-backends/3ds
        make -j
        $DEVKITARM/bin/arm-none-eabi-strip ./build/cpymo.elf
        ./makerom -f cia -o cpymo.cia -elf ./build/cpymo.elf -rsf cpymo.rsf -exefslogo -target t -icon icon -banner banner

    - name: Upload cia
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Nintendo 3DS (cia)
        path: ./cpymo-backends/3ds/cpymo.cia

    - name: Upload 3dsx
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Nintendo 3DS (3dsx)
        path: ./cpymo-backends/3ds/cpymo.3dsx

  build-wii:
    name: 'Nintendo Wii'
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20230110

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          submodules: true

      - name: 'Build'
        run: |
          cd cpymo-backends/sdl1
          make -f Makefile.Wii -j
          mv wii-meta.xml meta.xml
          mv wii-icon.png icon.png

      - name: 'Package'
        run: |
          cd ./cpymo-backends/sdl1
          pacman -S --noconfirm --needed zip >/dev/null 2>&1 || true
          mkdir -p dist/apps/CPyMO
          cp boot.dol icon.png meta.xml dist/apps/CPyMO/
          cd dist && zip -qr ../CPyMO-wii.zip apps
          unzip -l ../CPyMO-wii.zip

      - name: 'Upload'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: CPyMO for Nintendo Wii
          path: ./cpymo-backends/sdl1/CPyMO-wii.zip

  build-psv:
    name: 'Sony PSV'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Install Dependents
      run: |
        git clone https://github.com/vitasdk/vdpm.git --depth 1
        cd vdpm
        export VITASDK=~/vitasdk
        export PATH=$VITASDK/bin:$PATH
        export VDPM_NONINTERACTIVE=1
        ./bootstrap-vitasdk.sh
        # Use the frontend the bootstrap installed. Current releases put the
        # package client at libexec/vdpm/pacman, while the clone's legacy
        # ./vdpm script still looks for bin/pacman.
        $VITASDK/bin/vdpm install sdl2
        $VITASDK/bin/vdpm install sdl2_mixer
        $VITASDK/bin/vdpm install flac
        $VITASDK/bin/vdpm install libmodplug
        $VITASDK/bin/vdpm install mpg123
        $VITASDK/bin/vdpm install libogg
        $VITASDK/bin/vdpm install libvorbis
        $VITASDK/bin/vdpm install libmikmod
        $VITASDK/bin/vdpm install opus
        $VITASDK/bin/vdpm install opusfile
        $VITASDK/bin/vdpm install libxmp
        # cd ../cpymo-backends/sdl2
        # chmod +x ./build-psv-ffmpeg.sh
        # ./build-psv-ffmpeg.sh
        # cd ../../

    - name: Build
      run: |
        export VITASDK=~/vitasdk
        export PATH=$VITASDK/bin:$PATH
        cd cpymo-backends/sdl2
        make -f Makefile.PSV -j

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Sony PSV
        path: |
          ./cpymo-backends/sdl2/cpymo.vpk

  build-psp:
    name: 'Sony PSP'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@v1.1

    - name: Prepare PSPDEV directory
      run: |
        sudo mkdir -p /usr/local/pspdev
        sudo chown -R $USER: /usr/local/pspdev

    - name: Restore PSPDEV cache
      id: pspdev-cache
      uses: actions/cache@v4
      with:
        path: /usr/local/pspdev
        key: pspdev-${{ runner.os }}-v1
        restore-keys: |
          pspdev-

    - name: Install PSPDEV
      if: steps.pspdev-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/pspdev/pspdev.git --depth 1
        cd pspdev
        sudo ./prepare.sh
        export PSPDEV=/usr/local/pspdev
        sudo mkdir -p $PSPDEV
        sudo chown -R $USER: $PSPDEV
        export PATH=$PATH:$PSPDEV/bin
        ./build-all.sh
        psp-pacman -Syu

    - name: Restore FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v4
      with:
        path: cpymo-backends/build.FFmpeg.PSP
        key: ffmpeg-psp-${{ hashFiles('cpymo-backends/sdl2/build-psp-ffmpeg.sh') }}
        restore-keys: |
          ffmpeg-psp-

    - name: Build FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: |
        export PSPDEV=/usr/local/pspdev
        export PATH=$PATH:$PSPDEV/bin
        cd ./cpymo-backends/sdl2
        chmod +x ./build-psp-ffmpeg.sh
        ./build-psp-ffmpeg.sh

    - name: Build
      run: |
        export PSPDEV=/usr/local/pspdev
        export PATH=$PATH:$PSPDEV/bin
        psp-pacman -S sdl2 sdl2-image freetype2 sdl2-ttf --noconfirm
        cd ./cpymo-backends/sdl2
        make -f Makefile.PSP -j

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Sony PSP
        path: ./cpymo-backends/sdl2/EBOOT.PBP

  build-wasm:
    name: 'Emscripten'
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Restore FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v4
      with:
        path: cpymo-backends/build.FFmpeg.Emscripten
        key: ffmpeg-emscripten-${{ hashFiles('cpymo-backends/sdl2/build-emscripten-ffmpeg.sh') }}
        restore-keys: |
          ffmpeg-emscripten-

    - name: Build FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: |
        cd cpymo-backends/sdl2
        chmod +x ./build-emscripten-ffmpeg.sh
        ./build-emscripten-ffmpeg.sh

    - name: Build
      run: |
        cd cpymo-backends/sdl2
        export AUDIO_BACKEND=ffmpeg
        make -f Makefile.Emscripten -j
        mkdir -p ../../artifacts/web
        cp cpymo.js ../../artifacts/web/
        cp cpymo.wasm cpymo.data ../../artifacts/web/ 2>/dev/null || true

    - name: Build (Accessibility)
      run: |
        cd cpymo-backends/sdl2
        export AUDIO_BACKEND=ffmpeg
        make -f Makefile.Emscripten clean
        make -f Makefile.Emscripten -j ENABLE_ACCESSIBILITY=1
        mkdir -p ../../artifacts/web-accessibility
        cp cpymo.js ../../artifacts/web-accessibility/
        cp cpymo.wasm cpymo.data ../../artifacts/web-accessibility/ 2>/dev/null || true

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Web
        path: ./artifacts/web/

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Web (Accessibility)
        path: ./artifacts/web-accessibility/

    - name: Build packaged game
      if: ${{ inputs.web_game_archive_url != '' && inputs.web_build_type != '' }}
      run: |
        cd cpymo-backends/sdl2
        curl --fail --location --retry 3 --output game.zip "${{ inputs.web_game_archive_url }}"
        mkdir -p game
        unzip -q game.zip -d game
        export AUDIO_BACKEND=ffmpeg
        make -f Makefile.Emscripten clean
        make -f Makefile.Emscripten -j BUILD_GAME_DIR=game WASM=$([ "${{ inputs.web_build_type }}" = "wasm" ] && echo 1 || echo 0)
        mkdir -p ../../artifacts/web-game
        cp cpymo.html cpymo.js cpymo.data ../../artifacts/web-game/
        cp cpymo.wasm ../../artifacts/web-game/ 2>/dev/null || true

    - name: Upload packaged game
      if: ${{ inputs.web_game_archive_url != '' && inputs.web_build_type != '' }}
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO Web Game (${{ inputs.web_build_type }})
        path: ./artifacts/web-game/

  build-android:
    name: 'Android'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Setup JDK
      uses: actions/setup-java@v4.9.1
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup NDK
      uses: nttld/setup-ndk@v1.6.0
      id: setup-ndk
      with:
        ndk-version: r21e

    - name: Restore FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v4
      with:
        path: cpymo-backends/android/ffmpeg-android-maker/output
        key: ffmpeg-android-${{ hashFiles('cpymo-backends/android/build-android-ffmpeg.sh') }}-v1
        restore-keys: |
          ffmpeg-android-

    - name: Build FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        export ANDROID_SDK_HOME=$ANDROID_HOME
        cd cpymo-backends/android/
        chmod +x ./build-android-ffmpeg.sh
        # Retry up to 3 times on network errors (git.ffmpeg.org can return 502)
        built=0
        for i in 1 2 3; do
          rm -rf ffmpeg-android-maker/output
          if ./build-android-ffmpeg.sh && \
             test -f ffmpeg-android-maker/output/lib/arm64-v8a/libavformat.so && \
             test -f ffmpeg-android-maker/output/lib/armeabi-v7a/libavformat.so && \
             test -f ffmpeg-android-maker/output/lib/x86/libavformat.so && \
             test -f ffmpeg-android-maker/output/lib/x86_64/libavformat.so; then
            echo "FFmpeg build succeeded on attempt $i"
            built=1
            break
          else
            echo "FFmpeg build failed on attempt $i, retrying..."
            sleep 5
          fi
        done
        test "$built" = 1

    - name: Restore Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('cpymo-backends/android/**/*.gradle*', 'cpymo-backends/android/**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Build APK
      run: |
        cd ./cpymo-backends/android
        ./gradlew assembleRelease --stacktrace
        cp ./app/build/outputs/apk/release/app-release.apk ../../cpymo-signed.apk

    - name: Build APK (Accessibility)
      run: |
        cd ./cpymo-backends/android
        # 必须先清干净：否则 Gradle/CMake 会复用上一步普通版的产物，
        # 无障碍 APK 里其实没有无障碍代码。
        ./gradlew clean --stacktrace
        rm -rf app/.cxx app/build
        ./gradlew assembleRelease --stacktrace
        cp ./app/build/outputs/apk/release/app-release.apk ../../cpymo-accessibility-signed.apk
      env:
        ENABLE_TEXT_EXTRACT: 1
        ENABLE_TEXT_EXTRACT_ANDROID_ACCESSIBILITY: 1

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Android
        path: |
          ./cpymo-signed.apk

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Android (Accessibility)
        path: |
          ./cpymo-accessibility-signed.apk

  build-uwp:
    name: 'Universal Windows Platform'
    runs-on: 'windows-latest'

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Find Visual Studio
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Set up NASM
      uses: ilammy/setup-nasm@v1.3.1

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        # 只缓存二进制产物。vcpkg/downloads 一旦进缓存，恢复时会把 vcpkg/ 目录一并建出来，
        # 紧接的 git clone 就撞上「目标已存在」而失败（Windows 上必现）。
        path: |
          ${{ github.workspace }}/.vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ matrix.triplet || 'uwp' }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-${{ matrix.triplet || 'uwp' }}-

    - name: Download vcpkg
      run: git clone --depth 1 --branch 2026.10.16 -- https://github.com/microsoft/vcpkg

    - name: Bootstrap vcpkg
      run: |
        ./vcpkg/bootstrap-vcpkg.bat
        ./vcpkg/vcpkg integrate install

    - name: Install FFmpeg
      env:
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      run: |
        ./vcpkg/vcpkg install ffmpeg:x86-uwp ffmpeg:x64-uwp ffmpeg:arm64-uwp

    - name: Build
      run: |
        pushd cpymo-backends/uwp
        msbuild -m -p:UapAppxPackageBuildMode=SideLoadOnly -p:AppxBundlePlatforms="x86|x64|arm64" -p:AppxPackageSigningEnabled=true -p:Configuration=Release -p:PackageCertificateKeyFile=cert.pfx -p:PackageCertificatePassword="12345" CPyMO.vcxproj
        popd

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Universal Windows Platform
        path: ./cpymo-backends/uwp/AppPackages/CPyMO/

  build-SDL1-windows:
    name: 'Windows (SDL 1.2)'
    runs-on: 'windows-latest'
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - uses: msys2/setup-msys2@v2.33.0
      with:
        msystem: MINGW32
        update: true
        cache: true
        # mingw-w64-i686-make 已从 MSYS2 仓库移除（pacman 报 target not found），
        # 改用 MSYS2 自带的 make；MINGW32 环境的 gcc 仍在 PATH 里，产物同样是 32 位 exe。
        install: mingw-w64-i686-toolchain make unzip

    - name: 'Build'
      run: |
        wget https://www.libsdl.org/release/SDL-devel-1.2.15-mingw32.tar.gz
        wget https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-devel-1.2.12-VC.zip
        tar -xf SDL-devel-1.2.15-mingw32.tar.gz
        unzip SDL_mixer-devel-1.2.12-VC.zip
        cp SDL_mixer-1.2.12/include/SDL_mixer.h SDL-1.2.15/include/SDL/SDL_mixer.h
        cp SDL_mixer-1.2.12/lib/x86/SDL_mixer.lib SDL-1.2.15/lib/SDL_mixer.lib
        cp SDL-1.2.15/bin/SDL.dll cpymo-backends/sdl1/SDL.dll
        cp SDL_mixer-1.2.12/lib/x86/*.dll cpymo-backends/sdl1
        cp SDL_mixer-1.2.12/lib/x86/*.txt cpymo-backends/sdl1

        cd ./cpymo-backends/sdl1
        export SDL=../../SDL-1.2.15
        export USE_SDL_MIXER=1
        make -j
        strip cpymo.exe

        wget https://raw.githubusercontent.com/libsdl-org/SDL_mixer/SDL-1.2/COPYING
        mv COPYING COPYING.SDL_mixer.txt
        wget https://raw.githubusercontent.com/libsdl-org/SDL-1.2/main/COPYING
        mv COPYING COPYING.SDL.txt

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Windows (SDL 1.2)
        path: |
          ./cpymo-backends/sdl1/*.exe
          ./cpymo-backends/sdl1/*.dll
          ./cpymo-backends/sdl1/*.txt

  build-SDL1-linux:
    name: 'Linux (SDL 1.2)'
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: true

    - name: Install dependents
      run: |
        sudo apt-get update
        sudo apt-get install libsdl1.2-dev libsdl-mixer1.2-dev # libavcodec-dev libswscale-dev libavformat-dev libswresample-dev libavutil-dev

    - name: Build
      run: |
        cd cpymo-backends/sdl1
        export USE_SDL_MIXER=1
        make -j
        strip ./cpymo

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for Linux (SDL 1.2)
        path: ./cpymo-backends/sdl1/cpymo

  build-desktop:
    name: 'Desktop'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        tuple: [ linux-x64, win-x86, win-x64, win-arm64, win-arm64ec ] #, win-arm ]

        include:
          - tuple: win-x64
            os: windows-latest
            triplet: x64-windows-static
            arch: x64
            package-name: "Windows x64"
            cmake-flags: "-A x64 -DCMAKE_GENERATOR_PLATFORM=x64"
            vcpkg-path: "D:/a/CPyMO/CPyMO/vcpkg/scripts/buildsystems/vcpkg.cmake"
          - tuple: win-x86
            os: windows-latest
            triplet: x86-windows-static
            arch: x86
            package-name: "Windows x86"
            cmake-flags: "-A Win32 -DCMAKE_GENERATOR_PLATFORM=Win32"
            vcpkg-path: "D:/a/CPyMO/CPyMO/vcpkg/scripts/buildsystems/vcpkg.cmake"
          # - tuple: win-arm
          #   os: windows-latest
          #   triplet: arm-windows-static
          #   arch: amd64_arm
          #   package-name: "Windows ARM"
          #   cmake-flags: "-A arm -DCMAKE_GENERATOR_PLATFORM=arm"
          #   vcpkg-path: "D:/a/CPyMO/CPyMO/vcpkg/scripts/buildsystems/vcpkg.cmake"
          - tuple: win-arm64
            os: windows-latest
            triplet: arm64-windows-static
            arch: amd64_arm64
            package-name: "Windows ARM64"
            cmake-flags: "-A arm64 -DCMAKE_GENERATOR_PLATFORM=arm64"
            vcpkg-path: "D:/a/CPyMO/CPyMO/vcpkg/scripts/buildsystems/vcpkg.cmake"
          - tuple: win-arm64ec
            os: windows-latest
            # SDL2/FFmpeg have no arm64ec build. Arm64EC cannot link Arm64 libraries, but it
            # can link x64 ones (that x64 code then runs under the built-in x64 emulation),
            # so reuse the static x64 libraries the other Windows jobs already build.
            triplet: x64-windows-static
            arch: amd64_arm64
            package-name: "Windows ARM64EC"
            cmake-flags: "-A arm64ec -DCMAKE_GENERATOR_PLATFORM=arm64ec"
            vcpkg-path: "D:/a/CPyMO/CPyMO/vcpkg/scripts/buildsystems/vcpkg.cmake"
          - tuple: linux-x64
            os: ubuntu-latest
            triplet: x64-linux
            package-name: "Linux x64"
            vcpkg-path: "/home/runner/work/CPyMO/CPyMO/vcpkg/scripts/buildsystems/vcpkg.cmake"

    steps:
    - uses: actions/checkout@v4.4.0
      with:
        submodules: 'recursive'

    - uses: ilammy/msvc-dev-cmd@v1.13.0
      if: ${{ runner.os == 'Windows' }}
      with:
        arch: ${{ matrix.arch }}

    - name: Setup NASM
      uses: ilammy/setup-nasm@v1.3.1
      if: ${{ runner.os != 'Windows' }}

    - name: Setup Dependents for MacOS
      if: ${{ runner.os == 'macOS' }}
      run: brew install pkg-config autoconf autoconf-archive automake libtool

    - name: Setup Dependents for Ubuntu
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt install -y \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          libltdl-dev \
          libx11-dev \
          libibus-1.0-dev \
          libxft-dev \
          libxext-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libegl1-mesa-dev

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        # 只缓存二进制产物。vcpkg/downloads 一旦进缓存，恢复时会把 vcpkg/ 目录一并建出来，
        # 紧接的 git clone 就撞上「目标已存在」而失败（Windows 上必现）。
        path: |
          ${{ github.workspace }}/.vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ matrix.triplet || 'uwp' }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-${{ matrix.triplet || 'uwp' }}-

    - name: Download vcpkg
      run: git clone --depth 1 --branch 2026.10.16 -- https://github.com/microsoft/vcpkg

    - name: Bootstrap vcpkg
      run: |
        mkdir -p ~/.vcpkg
        touch ~/.vcpkg/vcpkg.path.txt
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg integrate install
      if: ${{ runner.os != 'Windows' }}

    - name: Bootstrap vcpkg (Windows)
      run: |
        ./vcpkg/bootstrap-vcpkg.bat
        ./vcpkg/vcpkg integrate install
      if: ${{ runner.os == 'Windows' }}

    - name: Install SDL2
      env:
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      run: ./vcpkg/vcpkg install sdl2:${{ matrix.triplet }}

    - name: Install FFMPEG
      env:
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      run: ./vcpkg/vcpkg install ffmpeg:${{ matrix.triplet }}

    - name: Configure CMake
      run: cmake "-DCMAKE_TOOLCHAIN_FILE=${{ matrix.vcpkg-path }}" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.cmake-flags }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Strip
      if: ${{ runner.os != 'Windows' }}
      run: |
        strip ./build/build/cpymo
        strip ./build/build/cpymo-tool

    - name: Package (Linux)
      if: ${{ runner.os == 'Linux' }}
      run: ./scripts/package-linux.sh ./build/build/cpymo ./dist "${{ matrix.package-name }}"

    - name: Package (macOS)
      if: ${{ runner.os == 'macOS' }}
      run: ./scripts/package-macos.sh ./build/build/cpymo ./dist "${{ matrix.package-name }}"

    - name: Package (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        # 资源与 Tolk 运行时都已编进 exe，这里只发这一个文件。
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item build/build/Release/cpymo.exe dist/cpymo.exe
          if (Test-Path build/build/Release/cpymo-tool.exe) { Copy-Item build/build/Release/cpymo-tool.exe dist/cpymo-tool.exe }
        Get-ChildItem dist

    - name: Upload
      uses: actions/upload-artifact@v6.0.0
      with:
        name: CPyMO for ${{ matrix.package-name }}
        path: ./dist/*
        if-no-files-found: error

