name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, hd, dev ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build-switch:
    name: 'Nintendo Switch'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20230507

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build (Accessibility)
      run: |
        cd ./cpymo-backends/sdl2
        make -j -f Makefile.Switch
        cp cpymo.nro cpymo-accessibility.nro

    - name: Clean
      run: |
        cd ./cpymo-backends/sdl2
        make -f Makefile.Switch clean

    - name: Build (Standard)
      run: |
        cd ./cpymo-backends/sdl2
        make -j -f Makefile.Switch ENABLE_TEXT_EXTRACT=0

    - name: Upload (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Nintendo Switch
        path: ./cpymo-backends/sdl2/cpymo.nro

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Nintendo Switch (Accessibility)
        path: ./cpymo-backends/sdl2/cpymo-accessibility.nro

  build-3ds:
    name: 'Nintendo 3DS'
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Makerom
      id: cache-makerom
      uses: actions/cache@v4
      with:
        path: ./cpymo-backends/3ds/makerom
        key: makerom-v0.17

    - name: Install Makerom
      if: steps.cache-makerom.outputs.cache-hit != 'true'
      run: |
        cd ./cpymo-backends/3ds
        wget https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip
        unzip makerom-v0.17-ubuntu_x86_64.zip -d .
        chmod +x makerom

    - name: Cache FFmpeg (3DS)
      id: cache-ffmpeg-3ds
      uses: actions/cache@v4
      with:
        path: |
          ./cpymo-backends/3ds/ffmpeg
          ./cpymo-backends/3ds/ffmpeg-build
        key: ffmpeg-3ds-${{ hashFiles('cpymo-backends/3ds/build-3ds-ffmpeg.sh') }}

    - name: Build FFmpeg
      if: steps.cache-ffmpeg-3ds.outputs.cache-hit != 'true'
      run: |
        cd ./cpymo-backends/3ds
        chmod +x ./build-3ds-ffmpeg.sh
        ./build-3ds-ffmpeg.sh

    - name: Build (Accessibility)
      run: |
        cd ./cpymo-backends/3ds
        make -j
        $DEVKITARM/bin/arm-none-eabi-strip ./build/cpymo.elf
        ./makerom -f cia -o cpymo-accessibility.cia -elf ./build/cpymo.elf -rsf cpymo.rsf -exefslogo -target t -icon icon -banner banner
        cp cpymo.3dsx cpymo-accessibility.3dsx

    - name: Clean
      run: |
        cd ./cpymo-backends/3ds
        make clean

    - name: Build (Standard)
      run: |
        cd ./cpymo-backends/3ds
        make -j ENABLE_TEXT_EXTRACT=0
        $DEVKITARM/bin/arm-none-eabi-strip ./build/cpymo.elf
        ./makerom -f cia -o cpymo.cia -elf ./build/cpymo.elf -rsf cpymo.rsf -exefslogo -target t -icon icon -banner banner

    - name: Upload cia (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Nintendo 3DS (cia)
        path: ./cpymo-backends/3ds/cpymo.cia

    - name: Upload 3dsx (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Nintendo 3DS (3dsx)
        path: ./cpymo-backends/3ds/cpymo.3dsx

    - name: Upload cia (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Nintendo 3DS (cia) (Accessibility)
        path: ./cpymo-backends/3ds/cpymo-accessibility.cia

    - name: Upload 3dsx (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Nintendo 3DS (3dsx) (Accessibility)
        path: ./cpymo-backends/3ds/cpymo-accessibility.3dsx

  build-wii:
    name: 'Nintendo Wii'
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20230110

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 'Build (Accessibility)'
        run: |
          cd cpymo-backends/sdl1
          make -f Makefile.Wii -j
          cp boot.dol boot-accessibility.dol
          cp wii-meta.xml meta.xml
          cp wii-icon.png icon.png

      - name: 'Clean'
        run: |
          cd cpymo-backends/sdl1
          make -f Makefile.Wii clean

      - name: 'Build (Standard)'
        run: |
          cd cpymo-backends/sdl1
          make -f Makefile.Wii -j ENABLE_TEXT_EXTRACT=0
          cp wii-meta.xml meta.xml
          cp wii-icon.png icon.png

      - name: 'Upload (Standard)'
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO for Nintendo Wii
          path: |
            ./cpymo-backends/sdl1/boot.dol
            ./cpymo-backends/sdl1/icon.png
            ./cpymo-backends/sdl1/meta.xml

      - name: 'Upload (Accessibility)'
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO for Nintendo Wii (Accessibility)
          path: |
            ./cpymo-backends/sdl1/boot-accessibility.dol
            ./cpymo-backends/sdl1/icon.png
            ./cpymo-backends/sdl1/meta.xml

  build-psv:
    name: 'Sony PSV'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Vita SDK
      id: cache-vitasdk
      uses: actions/cache@v4
      with:
        path: ~/vitasdk
        key: vitasdk-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Install Dependents
      if: steps.cache-vitasdk.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/vitasdk/vdpm.git --depth 1
        cd vdpm
        export VITASDK=~/vitasdk
        export PATH=$VITASDK/bin:$PATH
        ./bootstrap-vitasdk.sh
        ./vdpm sdl2
        ./vdpm sdl2_mixer
        ./vdpm flac
        ./vdpm libmodplug
        ./vdpm mpg123
        ./vdpm libogg
        ./vdpm libvorbis
        ./vdpm libmikmod
        ./vdpm opus
        ./vdpm opusfile
        ./vdpm libxmp

    - name: Build (Accessibility)
      run: |
        export VITASDK=~/vitasdk
        export PATH=$VITASDK/bin:$PATH
        cd cpymo-backends/sdl2
        make -f Makefile.PSV -j
        cp cpymo.vpk cpymo-accessibility.vpk

    - name: Clean
      run: |
        export VITASDK=~/vitasdk
        export PATH=$VITASDK/bin:$PATH
        cd cpymo-backends/sdl2
        make -f Makefile.PSV clean

    - name: Build (Standard)
      run: |
        export VITASDK=~/vitasdk
        export PATH=$VITASDK/bin:$PATH
        cd cpymo-backends/sdl2
        make -f Makefile.PSV -j ENABLE_TEXT_EXTRACT=0

    - name: Upload (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Sony PSV
        path: |
          ./cpymo-backends/sdl2/cpymo.vpk

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Sony PSV (Accessibility)
        path: |
          ./cpymo-backends/sdl2/cpymo-accessibility.vpk

  build-psp:
    name: 'Sony PSP'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@v1.1

    - name: Cache PSPDEV
      id: cache-pspdev
      uses: actions/cache@v4
      with:
        path: /usr/local/pspdev
        key: pspdev-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Install PSPDEV
      if: steps.cache-pspdev.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/pspdev/pspdev.git --depth 1
        cd pspdev
        sudo ./prepare.sh
        export PSPDEV=/usr/local/pspdev
        sudo mkdir -p $PSPDEV
        sudo chown -R $USER: $PSPDEV
        export PATH=$PATH:$PSPDEV/bin
        ./build-all.sh
        psp-pacman -Syu --noconfirm

    - name: Cache FFmpeg (PSP)
      id: cache-ffmpeg-psp
      uses: actions/cache@v4
      with:
        path: ./cpymo-backends/sdl2/ffmpeg
        key: ffmpeg-psp-${{ hashFiles('cpymo-backends/sdl2/build-psp-ffmpeg.sh') }}

    - name: Build FFmpeg
      if: steps.cache-ffmpeg-psp.outputs.cache-hit != 'true'
      run: |
        export PSPDEV=/usr/local/pspdev
        export PATH=$PATH:$PSPDEV/bin
        cd ./cpymo-backends/sdl2
        chmod +x ./build-psp-ffmpeg.sh
        ./build-psp-ffmpeg.sh

    - name: Build (Accessibility)
      run: |
        export PSPDEV=/usr/local/pspdev
        export PATH=$PATH:$PSPDEV/bin
        psp-pacman -S sdl2 sdl2-image freetype2 sdl2-ttf --noconfirm
        cd ./cpymo-backends/sdl2
        make -f Makefile.PSP -j
        cp EBOOT.PBP EBOOT-accessibility.PBP

    - name: Clean
      run: |
        export PSPDEV=/usr/local/pspdev
        export PATH=$PATH:$PSPDEV/bin
        cd ./cpymo-backends/sdl2
        make -f Makefile.PSP clean

    - name: Build (Standard)
      run: |
        export PSPDEV=/usr/local/pspdev
        export PATH=$PATH:$PSPDEV/bin
        cd ./cpymo-backends/sdl2
        make -f Makefile.PSP -j ENABLE_TEXT_EXTRACT=0

    - name: Upload (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Sony PSP
        path: ./cpymo-backends/sdl2/EBOOT.PBP

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Sony PSP (Accessibility)
        path: ./cpymo-backends/sdl2/EBOOT-accessibility.PBP

  build-wasm:
    name: 'Emscripten'
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache FFmpeg (Emscripten)
      id: cache-ffmpeg-em
      uses: actions/cache@v4
      with:
        path: ./cpymo-backends/sdl2/ffmpeg
        key: ffmpeg-emscripten-${{ hashFiles('cpymo-backends/sdl2/build-emscripten-ffmpeg.sh') }}

    - name: Build FFmpeg
      if: steps.cache-ffmpeg-em.outputs.cache-hit != 'true'
      run: |
        cd cpymo-backends/sdl2
        chmod +x ./build-emscripten-ffmpeg.sh
        ./build-emscripten-ffmpeg.sh

    - name: Build (Accessibility)
      run: |
        cd cpymo-backends/sdl2
        export AUDIO_BACKEND=ffmpeg
        make -f Makefile.Emscripten -j
        cp cpymo.js cpymo-accessibility.js
        cp cpymo.wasm cpymo-accessibility.wasm
        make -f Makefile.Emscripten clean

    - name: Build (Standard)
      run: |
        cd cpymo-backends/sdl2
        export AUDIO_BACKEND=ffmpeg
        make -f Makefile.Emscripten -j ENABLE_TEXT_EXTRACT=0

    - name: Upload (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Emscripten
        path: |
          ./cpymo-backends/sdl2/cpymo.js
          ./cpymo-backends/sdl2/cpymo.wasm

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Emscripten (Accessibility)
        path: |
          ./cpymo-backends/sdl2/cpymo-accessibility.js
          ./cpymo-backends/sdl2/cpymo-accessibility.wasm

  build-ios:
    name: 'iOS'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache FFmpeg (iOS)
        id: cache-ffmpeg-ios
        uses: actions/cache@v4
        with:
          path: ./cpymo-backends/ios/FFmpeg-iOS-build-script/thin
          key: ffmpeg-ios-${{ hashFiles('cpymo-backends/ios/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.cache-ffmpeg-ios.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ./cpymo-backends/ios
        run: bash ./build-ffmpeg.sh arm64

      - name: Build IPA
        shell: bash
        working-directory: ./cpymo-backends/ios
        run: |
          cmake -S. -Bbuild -DCMAKE_TOOLCHAIN_FILE=./ios-cmake/ios.toolchain.cmake -DENABLE_BITCODE=0 -DPLATFORM=OS64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j $(sysctl -n hw.physicalcpu) --config Release
          cd ./build
          mkdir Payload
          mv cpymo.app Payload/
          zip -r cpymo.ipa Payload
          mv ./cpymo.ipa ../../../cpymo.ipa

      - name: Build IPA (Accessibility)
        shell: bash
        working-directory: ./cpymo-backends/ios
        run: |
          cmake -S. -Bbuild-accessibility -DCMAKE_TOOLCHAIN_FILE=./ios-cmake/ios.toolchain.cmake -DENABLE_BITCODE=0 -DPLATFORM=OS64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_IOS_ACCESSIBILITY=ON
          cmake --build build-accessibility -j $(sysctl -n hw.physicalcpu) --config Release
          cd ./build-accessibility
          mkdir Payload
          mv cpymo.app Payload/
          zip -r cpymo-accessibility.ipa Payload
          mv ./cpymo-accessibility.ipa ../../../cpymo-accessibility.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO for iOS
          path: ./cpymo.ipa

      - name: Upload (Accessibility)
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO for iOS (Accessibility)
          path: ./cpymo-accessibility.ipa

  build-android:
    name: 'Android'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e

    - name: Cache FFmpeg (Android)
      id: cache-ffmpeg-android
      uses: actions/cache@v4
      with:
        path: |
          ./cpymo-backends/android/ffmpeg-android-maker/build
          ./cpymo-backends/android/ffmpeg-android-maker/output
        key: ffmpeg-android-${{ hashFiles('cpymo-backends/android/build-android-ffmpeg.sh') }}

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('cpymo-backends/android/**/*.gradle*', 'cpymo-backends/android/**/gradle-wrapper.properties') }}

    - name: Build FFmpeg
      if: steps.cache-ffmpeg-android.outputs.cache-hit != 'true'
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        export ANDROID_SDK_HOME=$ANDROID_HOME
        cd cpymo-backends/android/
        chmod +x ./build-android-ffmpeg.sh
        ./build-android-ffmpeg.sh

    - name: Build APK (Accessibility)
      run: |
        cd ./cpymo-backends/android
        ./gradlew assembleRelease --stacktrace
        cp ./app/build/outputs/apk/release/app-release.apk ../../cpymo-accessibility-signed.apk
      env:
        ENABLE_TEXT_EXTRACT: 1
        ENABLE_TEXT_EXTRACT_ANDROID_ACCESSIBILITY: 1

    - name: Clean
      run: |
        cd ./cpymo-backends/android
        ./gradlew clean

    - name: Build APK (Standard)
      run: |
        cd ./cpymo-backends/android
        ./gradlew assembleRelease --stacktrace
        cp ./app/build/outputs/apk/release/app-release.apk ../../cpymo-signed.apk

    - name: Upload (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Android
        path: ./cpymo-signed.apk

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Android (Accessibility)
        path: ./cpymo-accessibility-signed.apk

  build-uwp:
    name: 'Universal Windows Platform'
    runs-on: 'windows-2022'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Find Visual Studio
      uses: ilammy/msvc-dev-cmd@v1
      with:
        uwp: true

    - name: Set up NASM
      uses: ilammy/setup-nasm@v1.3.1

    - name: Cache vcpkg clone
      id: cache-vcpkg-clone
      uses: actions/cache@v4
      with:
        path: ./vcpkg
        key: vcpkg-clone-v1

    - name: Download vcpkg
      if: steps.cache-vcpkg-clone.outputs.cache-hit != 'true'
      run: git clone --depth 1 --branch master -- https://github.com/microsoft/vcpkg

    - name: Bootstrap vcpkg
      run: |
        ./vcpkg/bootstrap-vcpkg.bat
        ./vcpkg/vcpkg integrate install

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          ./vcpkg/packages
          ./vcpkg/buildtrees
          ./vcpkg/downloads
        key: vcpkg-uwp-v1

    - name: Install FFmpeg
      run: |
        ./vcpkg/vcpkg install ffmpeg:x86-uwp ffmpeg:x64-uwp ffmpeg:arm64-uwp

    - name: Build (Accessibility)
      run: |
        pushd cpymo-backends/uwp
        msbuild -m -p:UapAppxPackageBuildMode=SideLoadOnly -p:AppxBundlePlatforms="x86|x64|arm64" -p:AppxPackageSigningEnabled=true -p:Configuration=Release -p:PackageCertificateKeyFile=cert.pfx -p:PackageCertificatePassword="12345" -p:ENABLE_TEXT_EXTRACT=1 CPyMO.vcxproj
        popd
        mv cpymo-backends/uwp/AppPackages/CPyMO cpymo-backends/uwp/AppPackages/CPyMO-Accessibility

    - name: Clean
      run: |
        pushd cpymo-backends/uwp
        msbuild -t:Clean -p:Configuration=Release CPyMO.vcxproj
        popd

    - name: Build (Standard)
      run: |
        pushd cpymo-backends/uwp
        msbuild -m -p:UapAppxPackageBuildMode=SideLoadOnly -p:AppxBundlePlatforms="x86|x64|arm64" -p:AppxPackageSigningEnabled=true -p:Configuration=Release -p:PackageCertificateKeyFile=cert.pfx -p:PackageCertificatePassword="12345" CPyMO.vcxproj
        popd
        mv cpymo-backends/uwp/AppPackages/CPyMO cpymo-backends/uwp/AppPackages/CPyMO-Standard

    - name: Upload (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Universal Windows Platform
        path: ./cpymo-backends/uwp/AppPackages/CPyMO-Standard/

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Universal Windows Platform (Accessibility)
        path: ./cpymo-backends/uwp/AppPackages/CPyMO-Accessibility/

  build-SDL1-windows:
    name: 'Windows (SDL 1.2)'
    runs-on: 'windows-latest'
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: true
        install: mingw-w64-i686-toolchain mingw-w64-i686-SDL

    - name: Install SDL_mixer 1.2
      run: |
        pacman -U --noconfirm \
          https://repo.msys2.org/mingw/mingw32/mingw-w64-i686-libmad-0.15.1b-5-any.pkg.tar.zst \
          https://repo.msys2.org/mingw/mingw32/mingw-w64-i686-libmikmod-3.3.13-1-any.pkg.tar.zst \
          https://repo.msys2.org/mingw/mingw32/mingw-w64-i686-SDL_mixer-1.2.12-9-any.pkg.tar.zst

    - name: 'Build (Accessibility)'
      run: |
        cd ./cpymo-backends/sdl1
        export USE_SDL_MIXER=1
        mingw32-make -j ENABLE_TEXT_EXTRACT=1
        cp cpymo.exe cpymo-accessibility.exe
        strip cpymo.exe
        cp /mingw32/bin/SDL.dll .
        cp /mingw32/bin/libSDL_mixer-*.dll .

    - name: 'Clean'
      run: |
        cd ./cpymo-backends/sdl1
        mingw32-make clean

    - name: 'Build (Standard)'
      run: |
        cd ./cpymo-backends/sdl1
        export USE_SDL_MIXER=1
        mingw32-make -j ENABLE_TEXT_EXTRACT=0
        strip cpymo.exe
        cp /mingw32/bin/SDL.dll .
        cp /mingw32/bin/libSDL_mixer-*.dll .

    - name: 'Upload (Standard)'
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Windows (SDL 1.2)
        path: |
          ./cpymo-backends/sdl1/*.exe
          ./cpymo-backends/sdl1/*.dll
          ./cpymo-backends/sdl1/*.txt

    - name: 'Upload (Accessibility)'
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Windows (SDL 1.2) (Accessibility)
        path: |
          ./cpymo-backends/sdl1/cpymo-accessibility.exe
          ./cpymo-backends/sdl1/*.dll
          ./cpymo-backends/sdl1/*.txt

  build-SDL1-linux:
    name: 'Linux (SDL 1.2)'
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependents
      run: |
        sudo apt-get update
        sudo apt-get install libsdl1.2-dev libsdl-mixer1.2-dev

    - name: 'Build (Accessibility)'
      run: |
        cd cpymo-backends/sdl1
        export USE_SDL_MIXER=1
        make -j ENABLE_TEXT_EXTRACT=1
        strip ./cpymo
        cp cpymo cpymo-accessibility

    - name: 'Clean'
      run: |
        cd cpymo-backends/sdl1
        make clean

    - name: 'Build (Standard)'
      run: |
        cd cpymo-backends/sdl1
        export USE_SDL_MIXER=1
        make -j ENABLE_TEXT_EXTRACT=0
        strip ./cpymo

    - name: 'Upload (Standard)'
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Linux (SDL 1.2)
        path: ./cpymo-backends/sdl1/cpymo

    - name: 'Upload (Accessibility)'
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for Linux (SDL 1.2) (Accessibility)
        path: ./cpymo-backends/sdl1/cpymo-accessibility

  build-desktop:
    name: 'Desktop ${{ matrix.package-name }}'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        tuple: [ mac-x64, mac-arm64, linux-x64, win-x86, win-x64, win-arm64 ]

        include:
          - tuple: win-x64
            os: windows-latest
            triplet: x64-windows-static
            arch: x64
            package-name: "Windows x64"
            cmake-flags: "-A x64 -DCMAKE_GENERATOR_PLATFORM=x64"
          - tuple: win-x86
            os: windows-latest
            triplet: x86-windows-static
            arch: x86
            package-name: "Windows x86"
            cmake-flags: "-A Win32 -DCMAKE_GENERATOR_PLATFORM=Win32"
          - tuple: win-arm64
            os: windows-latest
            triplet: arm64-windows-static
            arch: amd64_arm64
            package-name: "Windows ARM64"
            cmake-flags: "-A arm64 -DCMAKE_GENERATOR_PLATFORM=arm64"
          - tuple: linux-x64
            os: ubuntu-latest
            triplet: x64-linux
            package-name: "Linux x64"
          - tuple: mac-x64
            os: macos-latest
            triplet: x64-osx
            package-name: "macOS x64"
            cmake-flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          - tuple: mac-arm64
            os: macos-latest
            triplet: arm64-osx
            package-name: "macOS Apple Silicon"
            cmake-flags: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ runner.os == 'Windows' }}
      with:
        arch: ${{ matrix.arch }}

    - name: Setup NASM
      uses: ilammy/setup-nasm@v1.3.1
      if: ${{ runner.os != 'Windows' }}

    - name: Setup Dependents for MacOS
      if: ${{ runner.os == 'macOS' }}
      run: brew install pkg-config autoconf autoconf-archive automake libtool

    - name: Setup Dependents for Ubuntu
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt install -y \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          libltdl-dev \
          libx11-dev \
          libibus-1.0-dev \
          libxft-dev \
          libxext-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libegl1-mesa-dev

    - name: Cache vcpkg clone
      id: cache-vcpkg-clone-desktop
      uses: actions/cache@v4
      with:
        path: ./vcpkg
        key: vcpkg-clone-v1

    - name: Download vcpkg
      if: steps.cache-vcpkg-clone-desktop.outputs.cache-hit != 'true'
      run: git clone --depth 1 --branch master -- https://github.com/microsoft/vcpkg

    - name: Bootstrap vcpkg
      run: |
        mkdir -p ~/.vcpkg
        touch ~/.vcpkg/vcpkg.path.txt
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg integrate install
      if: ${{ runner.os != 'Windows' }}

    - name: Bootstrap vcpkg (Windows)
      run: |
        ./vcpkg/bootstrap-vcpkg.bat
        ./vcpkg/vcpkg integrate install
      if: ${{ runner.os == 'Windows' }}

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          ./vcpkg/packages
          ./vcpkg/buildtrees
          ./vcpkg/downloads
        key: vcpkg-${{ matrix.triplet }}-v1

    - name: Install SDL2
      run: ./vcpkg/vcpkg install sdl2:${{ matrix.triplet }}

    - name: Install FFMPEG
      run: ./vcpkg/vcpkg install ffmpeg:${{ matrix.triplet }}

    - name: Configure CMake (Standard)
      run: cmake "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ matrix.cmake-flags }}

    - name: Build (Standard)
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Configure CMake (Accessibility)
      run: cmake "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -B ${{ github.workspace }}/build-accessibility -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_ACCESSIBILITY=ON ${{ matrix.cmake-flags }}

    - name: Build (Accessibility)
      run: cmake --build ${{github.workspace}}/build-accessibility --config ${{env.BUILD_TYPE}}

    - name: Strip
      if: ${{ runner.os != 'Windows' }}
      run: |
        strip ./build/build/cpymo
        strip ./build/build/cpymo-tool
        strip ./build-accessibility/build/cpymo
        strip ./build-accessibility/build/cpymo-tool

    - name: Upload (Standard)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for ${{ matrix.package-name }}
        path: |
          ./build/build/cpymo
          ./build/build/cpymo-tool
          ./build/build/cpymo.exe
          ./build/build/cpymo-tool.exe
          ./build/build/Release/cpymo.exe
          ./build/build/Release/cpymo-tool.exe
          ./build/build/Release/*.dll
          ./build/build/MinSizeRel/cpymo.exe
          ./build/build/MinSizeRel/cpymo-tool.exe

    - name: Upload (Accessibility)
      uses: actions/upload-artifact@v4
      with:
        name: CPyMO for ${{ matrix.package-name }} (Accessibility)
        path: |
          ./build-accessibility/build/cpymo
          ./build-accessibility/build/cpymo-tool
          ./build-accessibility/build/*.wav
          ./build-accessibility/build/cpymo.exe
          ./build-accessibility/build/cpymo-tool.exe
          ./build-accessibility/build/Release/cpymo.exe
          ./build-accessibility/build/Release/cpymo-tool.exe
          ./build-accessibility/build/Release/*.dll
          ./build-accessibility/build/Release/*.wav
          ./build-accessibility/build/MinSizeRel/cpymo.exe
          ./build-accessibility/build/MinSizeRel/cpymo-tool.exe

  build-ascii-art:
    name: 'CPyMO ASCII Art'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-latest', 'ubuntu-latest', 'macos-latest' ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: msys2/setup-msys2@v2
        if: ${{ runner.os == 'Windows' }}
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-toolchain make

      - name: 'Build (Accessibility)'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make -j ENABLE_TEXT_EXTRACT=1
          strip ./cpymo-ascii-art
          cp cpymo-ascii-art cpymo-ascii-art-accessibility

      - name: 'Build (Accessibility) (Windows)'
        shell: msys2 {0}
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make -j ENABLE_TEXT_EXTRACT=1
          strip ./cpymo-ascii-art.exe
          cp cpymo-ascii-art.exe cpymo-ascii-art-accessibility.exe

      - name: 'Clean'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make clean

      - name: 'Clean (Windows)'
        shell: msys2 {0}
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make clean

      - name: 'Build (Standard)'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make -j ENABLE_TEXT_EXTRACT=0
          strip ./cpymo-ascii-art

      - name: 'Build (Standard) (Windows)'
        shell: msys2 {0}
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd cpymo-backends/ascii-art/
          make -j ENABLE_TEXT_EXTRACT=0
          strip ./cpymo-ascii-art.exe

      - name: 'Upload (Standard)'
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO ASCII Art for ${{ runner.os }}
          path: |
            ./cpymo-backends/ascii-art/cpymo-ascii-art
            ./cpymo-backends/ascii-art/cpymo-ascii-art.exe

      - name: 'Upload (Accessibility)'
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO ASCII Art for ${{ runner.os }} (Accessibility)
          path: |
            ./cpymo-backends/ascii-art/cpymo-ascii-art-accessibility
            ./cpymo-backends/ascii-art/cpymo-ascii-art-accessibility.exe

  build-text:
    name: 'CPyMO Text'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-latest', 'ubuntu-latest', 'macos-latest' ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: msys2/setup-msys2@v2
        if: ${{ runner.os == 'Windows' }}
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-toolchain make

      - name: 'Build (Accessibility)'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/text/
          make -j
          strip cpymo-text
          cp cpymo-text cpymo-text-accessibility

      - name: 'Build (Accessibility) (Windows)'
        shell: msys2 {0}
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd cpymo-backends/text/
          make -j
          strip cpymo-text.exe
          cp cpymo-text.exe cpymo-text-accessibility.exe

      - name: 'Clean'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/text/
          make clean

      - name: 'Clean (Windows)'
        shell: msys2 {0}
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd cpymo-backends/text/
          make clean

      - name: 'Build (Standard)'
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd cpymo-backends/text/
          make -j ENABLE_TEXT_EXTRACT=0
          strip cpymo-text

      - name: 'Build (Standard) (Windows)'
        shell: msys2 {0}
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd cpymo-backends/text/
          make -j ENABLE_TEXT_EXTRACT=0
          strip cpymo-text.exe

      - name: 'Upload (Standard)'
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO Text for ${{ runner.os }}
          path: |
            ./cpymo-backends/text/cpymo-text
            ./cpymo-backends/text/cpymo-text.exe

      - name: 'Upload (Accessibility)'
        uses: actions/upload-artifact@v4
        with:
          name: CPyMO Text for ${{ runner.os }} (Accessibility)
          path: |
            ./cpymo-backends/text/cpymo-text-accessibility
            ./cpymo-backends/text/cpymo-text-accessibility.exe